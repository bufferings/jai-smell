# jai-smell のユーザー全体の設定ファイル。~/.config/jai-smell/jai-smell.toml に配置する。
# jai-smell init は、このファイルがすでに存在する場合は変更しない。
#
# プロジェクトごとの設定は、jai-smell.toml という名前でプロジェクトのディレクトリに配置する。
# チェック対象のファイルのディレクトリから上位に向かって探索し、最初に見つかった jai-smell.toml のルールセットを、
# この設定のルールセットに追加する。
#
# rule_files: ルールセットを記述したファイル。記述した順に、この設定ファイルの rule_sets より先に読み込む。
#   絶対パス、~/ から始まるパス、この設定ファイルのディレクトリからの相対パスで指定する。
#   preset-rules.toml: jai-smell が提供するルールセット。jai-smell init を実行するたびに上書きされる。
#   custom-rules.toml: 利用者が追加するルールセット。jai-smell init は、すでに存在する場合は変更しない。
#
# include: チェックの対象とするファイルの glob。省略した場合は、すべてのファイルを対象とする。空の配列は指定できない。
# exclude: チェックの対象外とするファイルの glob。include に一致するファイルにも優先して適用する。
#   絶対パス、~/ から始まるパス、この設定ファイルのディレクトリからの相対パスで指定する。
#   * はディレクトリの区切りをまたがず、** はまたぐ。
#   この設定ファイル（ユーザー全体の設定）に記述した場合は、この設定ファイルと rule_files のルールセットにのみ適用する。
#   jai-smell.toml（プロジェクトの設定）に記述した場合は、この設定ファイルのルールセットを含む、すべてのルールセットに適用する。
# exclude = ["~/src/team-project/**"]
#
# rule_sets: この設定ファイルに直接記述するルールセット。形式は custom-rules.toml を参照。

rule_files = ["preset-rules.toml", "custom-rules.toml"]
