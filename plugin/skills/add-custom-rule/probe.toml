# 文の形態素の分割位置と品詞を確認するための設定ファイル。
# jai-smell --config <このファイル> <例文のファイル> を実行すると、形態素ごとに「行:列: 品詞」を出力する。
# プリセットの検出結果を出力に含めないように、プリセットを適用しない。

[preset]
enabled = false

[[rule_sets]]
name = "品詞の確認"

[[rule_sets.entries]]
message = "名詞"
tokens = [{ pos = "名詞" }]

[[rule_sets.entries]]
message = "動詞"
tokens = [{ pos = "動詞" }]

[[rule_sets.entries]]
message = "形容詞"
tokens = [{ pos = "形容詞" }]

[[rule_sets.entries]]
message = "副詞"
tokens = [{ pos = "副詞" }]

[[rule_sets.entries]]
message = "助詞"
tokens = [{ pos = "助詞" }]

[[rule_sets.entries]]
message = "助動詞"
tokens = [{ pos = "助動詞" }]

[[rule_sets.entries]]
message = "連体詞"
tokens = [{ pos = "連体詞" }]

[[rule_sets.entries]]
message = "接続詞"
tokens = [{ pos = "接続詞" }]

[[rule_sets.entries]]
message = "接頭詞"
tokens = [{ pos = "接頭詞" }]

[[rule_sets.entries]]
message = "感動詞"
tokens = [{ pos = "感動詞" }]

[[rule_sets.entries]]
message = "記号"
tokens = [{ pos = "記号" }]

[[rule_sets.entries]]
message = "フィラー"
tokens = [{ pos = "フィラー" }]

[[rule_sets.entries]]
message = "その他"
tokens = [{ pos = "その他" }]
