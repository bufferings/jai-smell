# vX.Y.Z のタグをプッシュすると、arm64 の macOS でテストとビルドを実行し、tar.gz を GitHub の
# 下書きのリリースに添付する。下書きのリリースを公開すると bump-formula.yml が bufferings/homebrew-tap の
# formula を更新するため、公開前に下書きの tar.gz を手元で動作確認する。
#
# workflow_dispatch は動作確認用。下書きのリリースは作成せず、tar.gz をワークフローの成果物としてアップロードする。
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Resolve version
        id: version
        run: |
          version="$(jq -r '.version' package.json)"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::タグ $GITHUB_REF_NAME が package.json の version $version と一致しません"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Build
        run: |
          # 配布するのは arm64 のバイナリのみのため、ランナーのアーキテクチャが変更された場合に検知する
          test "$(uname -m)" = arm64
          bun run build

      - name: Smoke test
        # バイナリが node_modules を参照せずに単体で動作することを確認する
        run: sh scripts/smoke-test.sh

      - name: Generate third-party notices
        # 差分がないことは CI で確認済みだが、tar.gz に同梱するファイルはリリース時に再生成する
        run: bun run notices

      - name: Package
        id: package
        run: |
          name="jai-smell-${{ steps.version.outputs.version }}"
          mkdir -p "dist/$name"
          cp dist/jai-smell LICENSE THIRD-PARTY-NOTICES.txt README.md config/*.toml "dist/$name/"
          archive="dist/$name-arm64.tar.gz"
          tar -C dist -czf "$archive" "$name"
          shasum -a 256 "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${{ steps.package.outputs.archive }}"

      - name: Upload dry-run artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jai-smell-dry-run
          path: ${{ steps.package.outputs.archive }}
