# プッシュとプルリクエストのたびに、ローカルで実行しているチェック（フォーマット、lint、型、テスト）を実行する。
# 配布するバイナリと同じ arm64 の macOS で実行する。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format, lint, and type check
        run: bun run check

      - name: Test
        run: bun test

      - name: Third-party notices
        # 依存関係の変更後に THIRD-PARTY-NOTICES.txt を再生成していない場合は失敗させる
        run: |
          bun run notices
          git diff --exit-code THIRD-PARTY-NOTICES.txt

      - name: Build
        run: bun run build

      - name: Smoke test
        # バイナリが node_modules を参照せずに単体で動作することを確認する
        run: sh scripts/smoke-test.sh

      - name: Formula template check
        # packaging/homebrew/jai-smell.rb のプレースホルダーをダミーの値に置換して brew style を実行し、
        # テンプレートの誤りをリリース前に検出する。brew style は tap 内の formula のみを対象とするため、
        # 一時的な tap を作成して配置する
        run: |
          tapdir="$(brew --repository)/Library/Taps/bufferings/homebrew-jai-smell-ci"
          mkdir -p "$tapdir/Formula"
          dummy_sha256="$(printf '0%.0s' {1..64})"
          sed \
            -e "s/{{VERSION}}/0.0.0/g" \
            -e "s/{{SHA256}}/$dummy_sha256/g" \
            packaging/homebrew/jai-smell.rb \
            > "$tapdir/Formula/jai-smell.rb"
          brew style --formula "$tapdir/Formula/jai-smell.rb"
