# プッシュとプルリクエストのたびに、ローカルで実行しているチェック（fmt、clippy、test）を実行する。
# 配布するバイナリと同じ arm64 の macOS で実行する。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Install cargo-about
        # THIRD-PARTY-NOTICES.txt の生成に使用する。ビルド済みバイナリの sha256 を検証してからインストールする
        run: |
          version=0.9.2
          sha256=ae72f0df0c399a1e96336f696fa55b1b28679fd725632eba8cf8e4568467cc3e
          name="cargo-about-$version-aarch64-apple-darwin"
          curl -fsSL -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/$version/$name.tar.gz"
          echo "$sha256  $RUNNER_TEMP/$name.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"

      - name: Third-party notices
        # about.hbs、about.toml、Cargo.lock の変更後に THIRD-PARTY-NOTICES.txt を再生成していない場合は失敗させる
        run: |
          cargo about generate about.hbs -o THIRD-PARTY-NOTICES.txt
          git diff --exit-code THIRD-PARTY-NOTICES.txt

      - name: Formula template check
        # packaging/homebrew/jai-smell.rb のプレースホルダーをダミーの値に置換して brew style を実行し、
        # テンプレートの誤りをリリース前に検出する。brew style は tap 内の formula のみを対象とするため、
        # 一時的な tap を作成して配置する
        run: |
          tapdir="$(brew --repository)/Library/Taps/bufferings/homebrew-jai-smell-ci"
          mkdir -p "$tapdir/Formula"
          dummy_sha256="$(printf '0%.0s' {1..64})"
          sed \
            -e "s/{{VERSION}}/0.0.0/g" \
            -e "s/{{SHA256}}/$dummy_sha256/g" \
            packaging/homebrew/jai-smell.rb \
            > "$tapdir/Formula/jai-smell.rb"
          brew style --formula "$tapdir/Formula/jai-smell.rb"
