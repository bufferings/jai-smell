# jai-smell の設定ファイル。~/.config/jai-smell/jai-smell.toml に配置する。
#
# プロジェクトごとの設定は、jai-smell.toml という名前でプロジェクトのディレクトリに配置する。
# チェック対象のファイルのディレクトリから上位に向かって探索し、最初に見つかった jai-smell.toml のルールセットを、
# この設定のルールセットに追加する。
#
# include: チェックの対象とするファイルの glob。省略した場合は、すべてのファイルを対象とする。空の配列は指定できない。
# exclude: チェックの対象外とするファイルの glob。include に一致するファイルにも優先して適用する。
#   絶対パス、~/ から始まるパス、この設定ファイルのディレクトリからの相対パスで指定する。
#   * はディレクトリの区切りをまたがず、** はまたぐ。
#   この設定ファイル（ユーザー全体の設定）に記述した場合は、この設定ファイルのルールセットにのみ適用する。
#   jai-smell.toml（プロジェクトの設定）に記述した場合は、この設定ファイルのルールセットを含む、すべてのルールセットに適用する。
# exclude = ["~/src/team-project/**"]
#
# rule_sets: 検出する表現をまとめたルールセット。
#   name: ルールセットの名前。設定ファイルのエラーメッセージに表示する。
#   include、exclude: このルールセットにのみ適用する include と exclude。形式は上記と同じ。
#   entries: 検出する表現。tokens に指定した条件の並びと一致する、連続する形態素の並びを検出する。
#     条件に指定できるフィールドは surface_form, pos, pos_detail_1, pos_detail_2, pos_detail_3,
#     conjugated_type, conjugated_form, basic_form, reading, pronunciation（IPADIC の項目。フィールド名は kuromoji に準拠）。
#     値には文字列または文字列の配列を指定する。配列の場合は、いずれかの値に一致すれば条件を満たす。
#
# このサンプルには、次の 3 つのルールセットを収録している。
#   不自然な日本語化: 英語の表現を日本語に置き換えた不自然な表現
#   比喩: 物事を別のものにたとえた表現
#   話し言葉: 文書では用いない話し言葉
#
# 参考にした情報源:
#   p1ass/textlint-rule-preset-ai-words-ja（MIT License, Copyright (c) 2026 p1ass）
#     https://github.com/p1ass/textlint-rule-preset-ai-words-ja
#     「出典: p1ass」と記載した項目は、このプリセットの辞書の語と条件の記述を元にしている。
#   逆瀬川ちゃんのブログ「生成AI以前と以後でエンジニアの文章はどう変わったのか: Qiitaの7万記事を数えてみた話」
#     https://nyosegawa.com/posts/qiita-writing-before-after-ai/
#     p1ass/textlint-rule-preset-ai-words-ja の辞書の元になった分析。

[[rule_sets]]
name = "不自然な日本語化"

[[rule_sets.entries]]
# 出典: p1ass
message = "\"効く\" は、英語の表現を日本語に置き換えた不自然な表現です。定着したカタカナ語や一般的な表現に言い換えてください。例: 「効果がある」「役立つ」。例が文脈に適さない場合は、例を使用せずに文の構成を見直してください。"
tokens = [{ pos = "動詞", pos_detail_1 = "自立", basic_form = "効く" }]

[[rule_sets.entries]]
# 出典: p1ass
message = "\"走る\" は、英語の表現を日本語に置き換えた不自然な表現です。定着したカタカナ語や一般的な表現に言い換えてください。例: 「実行される」「動作する」。例が文脈に適さない場合は、例を使用せずに文の構成を見直してください。"
# basic_form = "走る" を条件にすると「自走する」の「走」も検出されるため、活用形を列挙する
tokens = [{ pos = "動詞", pos_detail_1 = "自立", surface_form = ["走る", "走っ", "走り", "走ら", "走れ", "走ろ"] }]

[[rule_sets.entries]]
# 出典: p1ass
message = "\"〜に落ちる\" は、英語の表現を日本語に置き換えた不自然な表現です。定着したカタカナ語や一般的な表現に言い換えてください。例: 「〜にフォールバックする」「代わりに〜を使用する」。例が文脈に適さない場合は、例を使用せずに文の構成を見直してください。"
# 「落ちる」のみを条件にすると「階段から落ちた」も検出されるため、直前の「に」を条件に含める
tokens = [
  { pos = "助詞", pos_detail_1 = "格助詞", surface_form = "に" },
  { pos = "動詞", pos_detail_1 = "自立", basic_form = "落ちる" },
]

