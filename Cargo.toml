[package]
name = "jai-smell"
version = "0.1.0"
edition = "2024"
description = "AI が生成した文章に多用される日本語の表現を検出するツール"
license = "MIT"
repository = "https://github.com/bufferings/jai-smell"

[dependencies]
globset = "0.4.20"
lindera = { version = "6.0.0", features = ["embed-ipadic"] }
pulldown-cmark = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
