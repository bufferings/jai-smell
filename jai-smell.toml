# このリポジトリのファイルにも jai-smell を適用する。textlint のルールも適用する。
# ただし、検出対象の言葉そのものを記述するテスト、サンプル、文章規範（悪い例として引用する）は対象外とする。
exclude = [
  "tests/**",
  "plugin/output-styles/**",
  "plugin/skills/**",
  "config/expression-rules.toml",
  "packaging/homebrew/jai-smell.rb",
]

# このリポジトリの文書は、硬い文体と表記に統一する
[expressions.rules]
colloquial = true
prefer-hiragana = true

[textlint]
enabled = true
# ソースコードのコメントにも適用する
include = ["**/*.md", "**/*.txt", "**/*.ts", "**/*.sh"]
