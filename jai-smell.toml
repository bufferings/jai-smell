# このリポジトリのファイルにも jai-smell を適用する。textlint のルールも適用する。
# ただし、検出対象の言葉そのものを記述するテスト、サンプル、文章規範（悪い例として引用する）は対象外とする。
exclude = [
  "tests/**",
  "plugin/output-styles/**",
  "plugin/skills/**",
  "config/preset-rules.toml",
  "config/custom-rules.toml",
  "packaging/homebrew/jai-smell.rb",
]

[textlint]
enabled = true
