# cargo-about の設定。THIRD-PARTY-NOTICES.txt の作成方法は about.hbs の先頭に記載している。
# MIT と Apache-2.0 のいずれかを選択できるクレートは、accepted の先頭にある MIT のライセンスを記載する。
accepted = ["MIT", "BSL-1.0", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0"]
# 配布しているバイナリのターゲット（aarch64-apple-darwin）でビルドされるクレートのみを対象とする。
# Windows 向けのクレートなど、このターゲットでビルドされない依存関係は記載しない。
targets = ["aarch64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# lindera のクレートにはライセンスファイルが同梱されていないため、GitHub リポジトリの LICENSE を参照する
[lindera.clarify]
license = "MIT"
[[lindera.clarify.git]]
path = "LICENSE"
license = "MIT"
checksum = "d37249886de3136db31717f15f6ade215a36fbed1c782381e38b2bf6047e8ec4"

[lindera-dictionary.clarify]
license = "MIT"
[[lindera-dictionary.clarify.git]]
path = "LICENSE"
license = "MIT"
checksum = "d37249886de3136db31717f15f6ade215a36fbed1c782381e38b2bf6047e8ec4"

